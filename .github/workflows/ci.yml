name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check JS files
        run: |
          set -e
          for f in js/*.js; do
            echo "checking $f"
            node --check "$f"
          done
      - name: Validate required files exist
        run: |
          test -f index.html
          test -f css/styles.css
          for f in js/openings.js js/board.js js/engine.js js/app.js; do
            test -f "$f" || (echo "missing $f" && exit 1)
          done
